name: Publish to PyPI

# Pushing a tag such as v0.8.0 builds the sdist and wheel and uploads them to
# PyPI with Trusted Publishing (no API token is stored in the repository).
# One-time setup on pypi.org: project dfm-python -> Manage -> Publishing ->
# add a GitHub publisher with owner "minkeymouse", repository "dfm-python",
# workflow "publish.yml" and environment "pypi".

#
# Either push a v* tag, or create a GitHub Release (Releases -> Draft a new
# release -> new tag v0.8.0 on main -> Publish). If both events fire for the
# same version, the second upload is skipped.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine@7 check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dfm-python
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # A manual run (workflow_dispatch) on main has no tag yet: after the upload
  # succeeds, tag the commit as v<version> and create the GitHub Release.
  # Runs started by a tag push or a published release already have both.
  github-release:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi
          awk -v v="## ${version}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          gh release create "${tag}" dist/* --target "${GITHUB_SHA}" \
            --title "dfm-python ${version}" --notes-file notes.md
