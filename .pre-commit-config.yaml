# Install the git hook with: uvx pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1; keep in step with the ruff version in uv.lock and CI
    hooks:
      - id: ruff-check
        args: [--fix]
      # Most files are not formatted yet; running this hook reformats every file
      # you touch. Run `pre-commit run ruff-format --all-files` to format everything.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
