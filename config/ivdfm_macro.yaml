# iVDFM on the Korean macro panel (data/macro.csv, weekly dates 1985-04-05 to 2025-11-21).
#
#   from dfm_python import iVDFM, PanelData
#   from dfm_python.config import iVDFMConfig, load_yaml
#   sections = load_yaml("config/ivdfm_macro.yaml")
#   data = PanelData.from_wide(df, **sections["data"])
#   model = iVDFM.from_config(iVDFMConfig.from_dict(sections["model"]))
#
# The model: section holds iVDFM's constructor parameters and is exactly what
# runs. Earlier releases let constructor defaults override some values of this
# file; these values now take effect and differ from what ran before:
#   n_factors: 3                 (ran as 5; see below)
#   factor_order: 3              (ran as 1)
#   encoder_n_hidden_layers: 3   (ran as 2)
#   decoder_n_hidden_layers: 3   (ran as 2)
#   prior_n_hidden_layers: 2     (ran as 1)
#   tol: 1.0e-5                  (ran as 5.0e-4)
#
# The three monthly targets are sparse on the weekly dates; fit interpolates
# them. The other series were never part of the model (neither targets nor
# context), so there are no exog columns: the context u_t is the generated time
# feature (time_context=1, the default).
#
# n_factors is 3, the number of targets (earlier files said 5). With more
# factors than targets and factor_order > 1, the engine's initialization of the
# AR coefficients (OLS on zero-padded PCA factors) makes the ELBO NaN in the
# first batch, so training fails; 5 factors only ran because factor_order was
# silently 1.
model:
  # Latent structure
  n_factors: 3                   # at most the number of targets when factor_order > 1
  window: 200                    # sliding-window length; stride=None means window // 2
  factor_order: 3                # AR order p of the factor dynamics
  innovation_distribution: laplace
  decoder_var: 0.01

  # Networks
  encoder_hidden_dim: 200
  encoder_n_hidden_layers: 3
  decoder_hidden_dim: 200
  decoder_n_hidden_layers: 3
  prior_hidden_dim: 100
  prior_n_hidden_layers: 2
  activation: lrelu
  slope: 0.1

  # Training
  learning_rate: 0.001
  optimizer: Adam
  batch_size: 256
  max_epochs: 10
  tol: 1.0e-5
  scaler: standard               # targets only; forecasts are returned in data units
  random_state: 3

# PanelData.from_wide arguments.
data:
  time_col: date
  target_cols: [KOEQUIPTE, KOEMPTOTO, KOHWRWEMP]
  exog_cols: []
