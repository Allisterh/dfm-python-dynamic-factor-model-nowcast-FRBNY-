[project]
name = "dfm-python"
version = "0.7.0"
description = "Dynamic Factor Model (DFM) estimation and forecasting in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Minkey Chang"}
]
keywords = ["dfm", "dynamic-factor-model", "forecasting", "time-series", "econometrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "einops>=0.8.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pykalman>=0.11.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.10.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
# iVDFM hyperparameter search (dfm_python.models.ivdfm.optuna)
tune = [
    "optuna>=4.7.0",
]
# Loading configurations from YAML files or OmegaConf DictConfig objects
yaml = [
    "omegaconf>=2.3.0",
]
# calculate_rmse / calculate_mae (dfm_python.utils.metric)
metrics = [
    "sktime>=0.40.1",
]
# Passing polars DataFrames to the dataset classes
polars = [
    "polars>=1.0.0",
]
# Running the scripts in tutorial/ (Hydra entry points)
examples = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]
all = [
    "dfm-python[tune,yaml,metrics,polars,examples]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "build>=1.4.0",
    "twine>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Prevent automatic license-file field addition
allow-direct-references = false
allow-license-file = false

[tool.hatch.build.targets.wheel]
packages = [
    "src/dfm_python",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "test_venv",
    "test_venv/**",
    "data/**",
    "uv.lock",
]

[dependency-groups]
# Development tooling for uv (`uv sync` installs this group by default).
# The package list lives in the `dev` extra above; this group points at it.
dev = [
    "dfm-python[dev]",
]

[project.urls]
Homepage = "https://github.com/minkeymouse/dfm-python"
Documentation = "https://github.com/minkeymouse/dfm-python#readme"
Repository = "https://github.com/minkeymouse/dfm-python"
Issues = "https://github.com/minkeymouse/dfm-python/issues"

[tool.ruff]
# Most of the codebase fits in 120 columns; this keeps the formatter's churn smallest.
line-length = 120
target-version = "py310"
extend-exclude = ["data", "outputs"]

[tool.ruff.lint]
# Lenient starter set. The ignores below silence rules that fire hundreds of
# times on existing code; they will be tightened step by step later.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "I001",   # unsorted-imports: re-sorting breaks circular imports between subpackages
    "E402",   # module-import-not-at-top-of-file (deliberate lazy/conditional imports)
    "E501",   # line-too-long (left to the formatter)
    "E701",   # multiple-statements-on-one-line-colon
    "E702",   # multiple-statements-on-one-line-semicolon
    "E722",   # bare-except
    "E731",   # lambda-assignment
    "E741",   # ambiguous-variable-name (math notation such as `l`, `I`)
    "W291",   # trailing-whitespace (mostly inside docstrings)
    "W293",   # blank-line-with-whitespace (mostly inside docstrings)
    "UP006",  # non-pep585-annotation (typing.List -> list)
    "UP007",  # non-pep604-annotation-union (Union[X, Y] -> X | Y)
    "UP035",  # deprecated-import (typing.List etc.)
    "UP045",  # non-pep604-annotation-optional (Optional[X] -> X | None)
    "F401",   # unused-import
    "F841",   # unused-variable
    "B007",   # unused-loop-control-variable
    "B023",   # function-uses-loop-variable
    "B024",   # abstract-base-class-without-abstract-method
    "B027",   # empty-method-without-abstract-decorator
    "B904",   # raise-without-from-inside-except
    "B905",   # zip-without-explicit-strict
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
filterwarnings = [
    # pykalman's filter assigns a shape-(1,) array into a scalar slot on every
    # time step (pykalman/standard.py); NumPy >= 1.25 deprecates this. Nothing
    # in dfm_python triggers it differently, so silence it until pykalman fixes it.
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning:pykalman.standard",
]
